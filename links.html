<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            width: 300px;
        }

        .profile {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0;
        }

        .link {
            display: block;
            background: #1e293b;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            transition: 0.3s;
        }

        .link:hover {
            background: #38bdf8;
            color: black;
        }
    </style>
</head>
<body>

    <div class="container">


        <h1>@regentnonny</h1>
        <p>Follow me everywhere 👇</p>

        <a href="https://www.tiktok.com/@regentnonny" class="link">TikTok</a>
        <a href="https://www.youtube.com/@regentnonny" class="link">Youtube</a>
        <a href="https://www.instagram.com/regentnonny/" class="link">instagram</a>
        <a href="https://www.facebook.com/regentnonny" class="link">Facebook</a>
    </div>

</body>
</html>
